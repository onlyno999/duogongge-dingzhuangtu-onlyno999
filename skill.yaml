name: "local_duogongge_dingzhuangtu"
title: "多宫格定妆图"
description: "用户上传人物图片（四视图定妆卡，或单张头像/照片）和一条本人音轨时，按刁哥样例样式做声纹卡：单张头像先按样例样式成四视图卡且容貌以原图为准1:1锁死不许改变，已有四视图则原图1:1直用；再在下方按样例比例（声纹区=照片高×566/1482）追加声纹区：波形用该音轨真画、原话用双模型ASR识别放右下角、语言标签按音轨实测，不许示意波形、不许套别人标签、不许乱P图。"
category: "Work and knowledge"
include_in_prompt: true
